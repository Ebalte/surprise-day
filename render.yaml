# Render Blueprint: сервер игры + игровой бот + админ-бот в одном бесплатном сервисе.
# Render → New → Blueprint → выберите этот репозиторий. Переменные с sync: false Render спросит при создании.
services:
  - type: web
    name: surprise-day-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build -w server && npm run db:deploy -w server && npm run db:sync-seasons:prod -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL   postgresql://neondb_owner:npg_WZoNfsjR1D6Q@ep-red-sunset-za3yy2lx.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require # строка подключения Neon (postgresql://...?sslmode=require)
        sync: false
      - key: BOT_TOKEN  9007606068:AAHuAvmLJZ7Jl4T532LOX4k8BGNDNsyDHpk
        sync: false
      - key: BOT_USERNAME tuktuk_egg_bot
        sync: false
      - key: MINI_APP_SHORT_NAME tuktuk_egg
        sync: false
      - key: WEB_APP_URL  https://ebalte.github.io/surprise-day/
        sync: false
      - key: ADMIN_BOT_TOKEN 9214330815:AAHptWm6Vxlxz2l2z6PtkCroQTzaH71-apA
        sync: false
      - key: ADMIN_IDS 5086271521
        sync: false
      - key: BOT_MODE
        value: webhook
